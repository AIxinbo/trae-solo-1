# ============================================================
# 生产环境 compose 覆盖文件
# 使用打包镜像 + 自动重启 + 资源限制
# 启动: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:
  # ---------- 前端：打包静态文件由 nginx 托管 ----------
  frontend:
    image: ${REGISTRY}/football-web:${IMAGE_TAG}
    restart: always
    environment:
      - TZ=${TZ}
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------- Java 后端：打包镜像 ----------
  backend:
    image: ${REGISTRY}/football-server:${IMAGE_TAG}
    restart: always
    environment:
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASS=${REDIS_PASS}
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASS=${MINIO_ROOT_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE}
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------- Python AI：打包镜像 ----------
  ai:
    image: ${REGISTRY}/football-ai:${IMAGE_TAG}
    restart: always
    environment:
      - TZ=${TZ}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - BACKEND_URL=http://backend:8080
    deploy:
      resources:
        limits:
          memory: 2G

  # ---------- Nginx：HTTPS 生产模式 ----------
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------- 基础设施：生产配置 ----------
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  milvus:
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G

  etcd:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
